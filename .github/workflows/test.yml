name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least-privilege: this workflow only checks out + runs tests (no writes).
permissions:
  contents: read

jobs:
  test:
    name: vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dependency-advisory gate (the "0 remaining" surface). Fails the build the
      # moment a HIGH-or-worse advisory lands in a PRODUCTION dependency.
      # `--omit=dev` scopes this to shipped deps, so dev-only advisories stay
      # visible via a local `npm audit` but cannot fail this gate — the shipped
      # product is what must stay clean. Low/moderate are surfaced, not blocking.
      # Local == CI: `npm run audit` runs the same flags. The gate shells out to
      # the live advisory DB, so an advisory filed tomorrow fails CI with no list
      # to edit — verify by pointing it at --audit-level=moderate and watching a
      # known moderate flip it red.
      - name: Audit production deps (high+ blocking)
        run: npm run audit

      # Coding-standards gate (jarvis docs/CODING-STANDARDS.md §3): correctness-
      # focused eslint. Errors fail CI; warnings surface but don't block.
      - name: Lint (eslint)
        run: npm run lint

      - name: Run vitest
        run: npm test

      # Plugin suites use node:test and live outside vitest's include glob
      # (test/**/*.test.js) — run them explicitly so they're CI-protected.
      - name: Run plugin tests (node:test)
        run: |
          shopt -s nullglob
          files=(server/plugins/*/test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No plugin test files found — skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "=== node --test $f ==="
            node --test "$f"
          done
