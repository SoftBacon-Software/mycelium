name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least-privilege: this workflow only checks out + runs tests (no writes).
permissions:
  contents: read

jobs:
  test:
    name: vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coding-standards gate (jarvis docs/CODING-STANDARDS.md §3): correctness-
      # focused eslint. Errors fail CI; warnings surface but don't block.
      - name: Lint (eslint)
        run: npm run lint

      - name: Run vitest
        run: npm test

      # Plugin suites use node:test and live outside vitest's include glob
      # (test/**/*.test.js) — run them explicitly so they're CI-protected.
      - name: Run plugin tests (node:test)
        run: |
          shopt -s nullglob
          files=(server/plugins/*/test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No plugin test files found — skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "=== node --test $f ==="
            node --test "$f"
          done

  # Runtime smoke for the recommended Docker install path — the half that
  # test/unit/docker-hardening.test.js (the static gate) explicitly punted to a
  # manual README step. Builds the real image, boots via the Dockerfile's actual
  # CMD (server/boot.js — an entrypoint no unit test imports), curls /health to
  # 200+db_ok, and confirms the non-root uid (1000) the static gate pins. Kept
  # OUT of `npm test` (no daemon assumption locally); ubuntu-latest ships Docker.
  # See scripts/docker-smoke.sh.
  docker-smoke:
    name: docker smoke (boot.js + /health + non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker runtime smoke
        run: bash scripts/docker-smoke.sh
